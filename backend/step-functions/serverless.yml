service: restaurant-stepfunctions

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    STAGE: ${self:provider.stage}
    ORDERS_TABLE: restaurant-orders-service-orders-${self:provider.stage}
    REVIEWS_TABLE: restaurant-reviews-${self:provider.stage}
    WEBSOCKET_ENDPOINT: https://ipnmobquh2.execute-api.us-east-1.amazonaws.com/dev
  iam:
    role: arn:aws:iam::281043631139:role/LabRole

plugins:
  - serverless-step-functions

functions:
  enableOrderReview:
    handler: handlers/enableOrderReview.handler
    description: Enable review for delivered order
    timeout: 30

  submitReview:
    handler: handlers/submitReview.handler
    description: Submit customer review and rating
    timeout: 30
    events:
      - http:
          path: reviews
          method: post
          cors: true

  getOrderReviews:
    handler: handlers/getOrderReviews.handler
    description: Get reviews for an order
    timeout: 30
    events:
      - http:
          path: reviews/{orderId}
          method: get
          cors: true

stepFunctions:
  validate: true
  stateMachines:
    enableReviewWorkflow:
      id: EnableReviewWorkflowStateMachine
      name: EnableReviewWorkflow-${self:provider.stage}
      role: arn:aws:iam::281043631139:role/LabRole
      definition:
        Comment: "Enable review option after order delivery"
        StartAt: WaitAfterDelivery
        States:
          WaitAfterDelivery:
            Type: Wait
            Seconds: 30  # 30 segundos después de entrega
            Next: EnableReview
          
          EnableReview:
            Type: Task
            Resource:
              Fn::GetAtt: [enableOrderReview, Arn]
            End: true
            Retry:
              - ErrorEquals:
                  - States.ALL
                IntervalSeconds: 30
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.error
                Next: WorkflowFailed
          
          WorkflowFailed:
            Type: Fail
            Cause: "Failed to enable review"

resources:
  Resources:
    ReviewsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.REVIEWS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: customerId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: OrderIdIndex
            KeySchema:
              - AttributeName: orderId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: CustomerIdIndex
            KeySchema:
              - AttributeName: customerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # EventBridge Rule para disparar Step Function cuando pedido es entregado
    EnableReviewWorkflowEventRule:
      Type: AWS::Events::Rule
      Properties:
        Description: "Trigger review workflow when order is delivered"
        EventBusName: restaurant-events-dev
        EventPattern:
          source:
            - restaurant.orders
          detail-type:
            - OrderStatusChanged
          detail:
            newStatus:
              - entregado
        State: ENABLED
        Targets:
          - Arn:
              Ref: EnableReviewWorkflowStateMachine
            RoleArn: arn:aws:iam::281043631139:role/LabRole
            Id: EnableReviewWorkflowTarget
