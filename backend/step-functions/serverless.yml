service: restaurant-stepfunctions

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    STAGE: ${self:provider.stage}
    ORDERS_TABLE: restaurant-orders-${self:provider.stage}
    REVIEWS_TABLE: restaurant-reviews-${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ORDERS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.REVIEWS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.REVIEWS_TABLE}/index/*
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: "*"

plugins:
  - serverless-step-functions

functions:
  enableOrderReview:
    handler: handlers/enableOrderReview.handler
    description: Enable review for delivered order
    timeout: 30

  submitReview:
    handler: handlers/submitReview.handler
    description: Submit customer review and rating
    timeout: 30
    events:
      - http:
          path: reviews
          method: post
          cors: true

  getOrderReviews:
    handler: handlers/getOrderReviews.handler
    description: Get reviews for an order
    timeout: 30
    events:
      - http:
          path: reviews/{orderId}
          method: get
          cors: true

stepFunctions:
  stateMachines:
    enableReviewWorkflow:
      name: EnableReviewWorkflow-${self:provider.stage}
      definition:
        Comment: "Enable review option after order delivery"
        StartAt: WaitAfterDelivery
        States:
          WaitAfterDelivery:
            Type: Wait
            Seconds: 300  # 5 minutos después de entrega
            Next: EnableReview
          
          EnableReview:
            Type: Task
            Resource:
              Fn::GetAtt: [enableOrderReview, Arn]
            End: true
            Retry:
              - ErrorEquals:
                  - States.ALL
                IntervalSeconds: 30
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.error
                Next: WorkflowFailed
          
          WorkflowFailed:
            Type: Fail
            Cause: "Failed to enable review"
      events:
        - eventBridge:
            eventBus: restaurant-events-${self:provider.stage}
            pattern:
              source:
                - restaurant.orders
              detail-type:
                - OrderStatusChanged
              detail:
                newStatus:
                  - entregado

resources:
  Resources:
    ReviewsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.REVIEWS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: customerId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: OrderIdIndex
            KeySchema:
              - AttributeName: orderId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: CustomerIdIndex
            KeySchema:
              - AttributeName: customerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
