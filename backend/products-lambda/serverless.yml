service: restaurant-products-service

provider:
  name: aws
  runtime: nodejs18.x
  stage: dev
  region: us-east-1
  memorySize: 512
  timeout: 30
  
  environment:
    PRODUCTS_TABLE: Products
    IMAGES_BUCKET: ${self:service}-${self:provider.stage}-images
  
  iam:
    role: arn:aws:iam::281043631139:role/LabRole

functions:
  listProducts:
    handler: handlers/products.listProducts
    events:
      - http:
          path: products
          method: get
          cors: true

  getProduct:
    handler: handlers/products.getProduct
    events:
      - http:
          path: products/{id}
          method: get
          cors: true

  createProduct:
    handler: handlers/products.createProduct
    events:
      - http:
          path: products
          method: post
          cors: true
          authorizer:
            name: authorizerFunc
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 300

  updateProduct:
    handler: handlers/products.updateProduct
    events:
      - http:
          path: products/{id}
          method: put
          cors: true
          authorizer:
            name: authorizerFunc
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 300

  deleteProduct:
    handler: handlers/products.deleteProduct
    events:
      - http:
          path: products/{id}
          method: delete
          cors: true
          authorizer:
            name: authorizerFunc
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 300

  uploadImage:
    handler: handlers/images.uploadImage
    events:
      - http:
          path: products/images/upload
          method: post
          cors: true
          authorizer:
            name: authorizerFunc
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 300

  getImage:
    handler: handlers/images.getImage
    events:
      - http:
          path: products/images/{key}
          method: get
          cors: true

  deleteImage:
    handler: handlers/images.deleteImage
    events:
      - http:
          path: products/images/{key}
          method: delete
          cors: true
          authorizer:
            name: authorizerFunc
            type: token
            identitySource: method.request.header.Authorization
            resultTtlInSeconds: 300

  authorizerFunc:
    handler: handlers/authorizer.handler

resources:
  Resources:
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.PRODUCTS_TABLE}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: category
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CategoryIndex
            KeySchema:
              - AttributeName: category
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.IMAGES_BUCKET}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
                - HEAD
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: '*'
              Action:
                - s3:GetObject
              Resource:
                - arn:aws:s3:::${self:provider.environment.IMAGES_BUCKET}/*

plugins:
  - serverless-offline
